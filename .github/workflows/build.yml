name: Build BeastMode KernelSU-Next (N960F OneUI 2.5)

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Prepare WireGuard Stubs & Locate Kernel Root
        run: |
          if [ ! -d "drivers" ]; then
            SUBDIR=$(find . -maxdepth 2 -type d -name "drivers" | head -n 1 | xargs -r dirname)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              cd "$SUBDIR"
            else
              echo "Could not find kernel root directory"
              pwd
              ls -la
              exit 1
            fi
          fi

          mkdir -p net/wireguard
          [ -f "net/wireguard/Kconfig" ] || touch net/wireguard/Kconfig
          [ -f "net/wireguard/Makefile" ] || echo "# WireGuard stub" > net/wireguard/Makefile
          ls -la net/wireguard/

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libncurses5-dev lz4 python3 python3-pip zip wget unzip

      - name: Setup GCC 4.9 Toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/aarch64-linux-android-4.9

      - name: Integrate KernelSU-Next
        run: |
          rm -rf KernelSU-Next-src KernelSU-Next drivers/kernelsu
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next.git KernelSU-Next-src

          if [ -f "KernelSU-Next-src/kernel/setup.sh" ]; then
            bash KernelSU-Next-src/kernel/setup.sh drivers/ || true
          fi

          if [ ! -d "drivers/kernelsu" ]; then
            mkdir -p drivers/kernelsu
            cp -r KernelSU-Next-src/kernel/* drivers/kernelsu/
          fi

          if [ -f "drivers/kernelsu/Kconfig" ] && ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if [ -f "drivers/kernelsu/Makefile" ] && ! grep -q "kernelsu/" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          ls -la drivers/kernelsu
          grep -rnE "ksu_handle_|kernelsu_init" drivers/kernelsu/ | head -n 30 || true

      - name: Fix Kernel 4.9 Headers, Include Paths & Backport path_umount
        run: |
          mkdir -p net/wireguard
          [ -f "net/wireguard/Kconfig" ] || touch net/wireguard/Kconfig
          [ -f "net/wireguard/Makefile" ] || echo "# WireGuard stub" > net/wireguard/Makefile

          python3 - << 'EOF'
          import re

          with open("include/linux/audit.h", "r", encoding="utf-8", errors="ignore") as f:
              text = f.read()
          text = re.sub(
              r"static inline int audit_update_lsm_rules\(void\)\s*\{[^}]*\}",
              "// removed duplicate stub",
              text,
          )
          with open("include/linux/audit.h", "w", encoding="utf-8") as f:
              f.write(text)

          with open("drivers/trace/exynos-ss-log.c", "r", encoding="utf-8", errors="ignore") as f:
              text = f.read()
          target = "static inline void exynos_ss_get_busiest_irq("
          if target in text and "#if 0\n" + target not in text:
              text = text.replace(target, "\n#if 0\n" + target, 1) + "\n#endif\n"
          with open("drivers/trace/exynos-ss-log.c", "w", encoding="utf-8") as f:
              f.write(text)

          with open("fs/namespace.c", "r", encoding="utf-8", errors="ignore") as f:
              text = f.read()
          patch = """
          static int can_umount(const struct path *path, int flags)
          {
          \tstruct mount *mnt = real_mount(path->mnt);
          \tif (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          \t\treturn -EINVAL;
          \tif (!may_mount())
          \t\treturn -EPERM;
          \tif (path->dentry != path->mnt->mnt_root)
          \t\treturn -EINVAL;
          \tif (!check_mnt(mnt))
          \t\treturn -EINVAL;
          \tif (mnt->mnt.mnt_flags & MNT_LOCKED)
          \t\treturn -EINVAL;
          \tif (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          \t\treturn -EPERM;
          \treturn 0;
          }

          int path_umount(struct path *path, int flags)
          {
          \tstruct mount *mnt = real_mount(path->mnt);
          \tint ret;
          \tret = can_umount(path, flags);
          \tif (!ret)
          \t\tret = do_umount(mnt, flags);
          \tdput(path->dentry);
          \tmntput_no_expire(mnt);
          \treturn ret;
          }
          """
          if "int path_umount(" not in text and "SYSCALL_DEFINE2(umount," in text:
              text = text.replace("SYSCALL_DEFINE2(umount,", patch + "\nSYSCALL_DEFINE2(umount,", 1)
          with open("fs/namespace.c", "w", encoding="utf-8") as f:
              f.write(text)
          EOF

          sed -i 's|#include "drivers/|#include "../../../drivers/|g' security/samsung/five/*.c security/samsung/five/*.h 2>/dev/null || true
          sed -i '/wakeup_source_blocker/i static void wakeup_source_deactivate(struct wakeup_source *ws);' drivers/base/power/wakeup.c
          sed -i '/exynos_ss_hook_hardlockup_entry/i static inline void update_hardlockup_type(int cpu) {}' drivers/trace/exynos-ss-utils.c
          sed -i '/extern void __init mnt_init/a int path_umount(struct path *path, int flags);' fs/internal.h

      - name: Patch Linux 4.9 Hooks & Enable KernelSU in Defconfig
        run: |
          mkdir -p net/wireguard out
          [ -f "net/wireguard/Kconfig" ] || touch net/wireguard/Kconfig
          [ -f "net/wireguard/Makefile" ] || echo "# WireGuard stub" > net/wireguard/Makefile

          python3 - << 'EOF'
          import re

          def inject_before_func_def(path, func_name, decl_line, check_str):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  src = f.read()
              if check_str in src:
                  return
              # Match a function definition header ending with ")\n{"
              pattern = re.compile(
                  r"(?m)^(?:static\s+)?(?:inline\s+)?[\w\*\s]+\b" + re.escape(func_name) + r"\s*\([^;]*?\)\s*\n\{",
              )
              m = pattern.search(src)
              if not m:
                  return
              idx = m.start()
              src = src[:idx] + decl_line + "\n\n" + src[idx:]
              with open(path, "w", encoding="utf-8") as f:
                  f.write(src)

          inject_before_func_def(
              "fs/exec.c",
              "do_execveat_common",
              "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);",
              "ksu_handle_execveat",
          )
          inject_before_func_def(
              "drivers/input/input.c",
              "input_event",
              "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);",
              "ksu_handle_input_handle_event",
          )
          EOF

          DEFCONFIG="exynos9810-crownlte_defconfig"
          scripts/config --file arch/arm64/configs/$DEFCONFIG -e KSU -d KPROBES -d KPROBE_EVENTS
          make O=out $DEFCONFIG
          scripts/config --file out/.config -e KSU -d KPROBES -d KPROBE_EVENTS
          grep -E "^CONFIG_KSU=" out/.config || { echo "ERROR: CONFIG_KSU not enabled in out/.config"; exit 1; }

      - name: Build Kernel Image
        run: |
          set -o pipefail
          mkdir -p net/wireguard
          [ -f "net/wireguard/Kconfig" ] || touch net/wireguard/Kconfig
          [ -f "net/wireguard/Makefile" ] || echo "# WireGuard stub" > net/wireguard/Makefile

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          make O=out -j$(nproc --all) Image 2>&1 | tee build.log || {
            echo "=== LAST 80 LINES OF BUILD LOG ==="
            tail -n 80 build.log
            echo "=== MATCHED ERRORS ==="
            grep -iE "error:|undefined reference|make\[.*Error" build.log | tail -n 40 || true
            exit 1
          }
          ls -lh out/arch/arm64/boot/Image

      - name: Package TWRP Flashable Kernel ZIP (AnyKernel3)
        run: |
          rm -rf pkg_work dist_zip ak3_repo BeastMode-N960F-OneUI2.5-KernelSU-Next.zip
          mkdir -p pkg_work dist_zip

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_repo
          cp -r ak3_repo/* pkg_work/
          rm -rf pkg_work/.git pkg_work/.github

          test -f out/arch/arm64/boot/Image
          cp out/arch/arm64/boot/Image pkg_work/Image

          python3 - << 'EOF'
          import re

          with open("pkg_work/anykernel.sh", "r", encoding="utf-8", errors="ignore") as f:
              text = f.read()

          text = re.sub(
              r"(?mi)^\s*block\s*=.*$",
              "BLOCK=/dev/block/platform/11120000.ufs/by-name/BOOT;",
              text,
          )
          text = re.sub(
              r"(?mi)^\s*do\.devicecheck\s*=.*$",
              "do.devicecheck=0;",
              text,
          )
          text = re.sub(
              r"(?mi)^\s*is_slot_device\s*=.*$",
              "is_slot_device=0;",
              text,
          )

          with open("pkg_work/anykernel.sh", "w", encoding="utf-8") as f:
              f.write(text)
          EOF

          grep -niE "block=|do\.devicecheck=|is_slot_device=" pkg_work/anykernel.sh
          test -f pkg_work/META-INF/com/google/android/update-binary
          test -f pkg_work/tools/ak3-core.sh

          ZIP_ABS="$(pwd)/dist_zip/BeastMode-N960F-OneUI2.5-KernelSU-Next.zip"
          (
            cd pkg_work
            zip -r "$ZIP_ABS" .
          )
          ls -lh "$ZIP_ABS"
          unzip -l "$ZIP_ABS" | head -n 30
          zip -T "$ZIP_ABS"

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BeastMode-N960F-OneUI2.5-KernelSU-Next
          path: dist_zip/
