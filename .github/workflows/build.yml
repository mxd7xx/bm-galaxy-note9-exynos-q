name: Build BeastMode KernelSU-Next (N960F OneUI 2.5)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libncurses5-dev lz4 python3 python3-pip zip wget

      - name: Setup GCC 4.9 Toolchain (Android NDK / Linaro)
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/aarch64-linux-android-4.9

      - name: Integrate KernelSU-Next (Legacy 4.9)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy

      - name: Detect Defconfig & Enable KernelSU
        run: |
          DEFCONFIG=$(ls arch/arm64/configs/*crownlte* 2>/dev/null | head -n 1 | xargs -n 1 basename)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG=$(ls arch/arm64/configs/*exynos9810* 2>/dev/null | head -n 1 | xargs -n 1 basename)
          fi
          echo "Using defconfig: $DEFCONFIG"
          echo "DEFCONFIG_NAME=$DEFCONFIG" >> $GITHUB_ENV
          echo "CONFIG_KSU=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/$DEFCONFIG

      - name: Build Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          mkdir -p out
          make O=out $DEFCONFIG_NAME
          make O=out -j$(nproc --all) Image

      - name: Package AnyKernel3 Flashable ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=/dev/block/platform/11120000.ufs/by-name/BOOT;|g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          cd AnyKernel3
          zip -r9 ../BeastMode-N960F-OneUI2.5-KernelSU-Next.zip * -x .git README.md *placeholder

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BeastMode-N960F-OneUI2.5-KernelSU-Next
          path: BeastMode-N960F-OneUI2.5-KernelSU-Next.zip
