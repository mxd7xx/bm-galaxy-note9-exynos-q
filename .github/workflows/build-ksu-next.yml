name: Build BeastMode KernelSU-Next (N960F)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies and Clang Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git libssl-dev \
            libelf-dev lzop python3 zip unzip cpio kmod clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup KernelSU-Next in drivers/kernelsu
        run: |
          rm -rf drivers/kernelsu KernelSU-Next
          git clone --depth=1 --branch=v3.4.2 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next || git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          if [ -d "KernelSU-Next/kernel" ]; then
            cp -r KernelSU-Next/kernel drivers/kernelsu
          else
            cp -r KernelSU-Next drivers/kernelsu
          fi
          rm -rf drivers/kernelsu/.git

          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q "obj-\$(CONFIG_KSU) += kernelsu/" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

      - name: Inspect KernelSU-Next Symbols and Kconfig
        run: |
          echo "=== Kconfig ==="
          cat drivers/kernelsu/Kconfig
          echo "=== Hook / Handler Functions ==="
          grep -rnE "(int|void|bool|long)\s+ksu_[a-zA-Z0-9_]+\s*\(" drivers/kernelsu/ | head -n 80
          grep -rnE "ksu_handle_[a-zA-Z0-9_]+" drivers/kernelsu/ | head -n 80

      - name: Patch Linux 4.9 Hooks and Compatibility Fixes
        run: |
          python3 - << 'EOF'
          from pathlib import Path

          # 1. fs/exec.c hook (do_execveat_common)
          exec_path = Path("fs/exec.c")
          exec_src = exec_path.read_text(encoding="utf-8", errors="ignore")
          if "ksu_handle_execveat" not in exec_src:
              target = "static int do_execveat_common(int fd, struct filename *filename,"
              idx = exec_src.find(target)
              if idx != -1:
                  brace_idx = exec_src.find("{\n", idx)
                  if brace_idx != -1:
                      decl = (
                          "\n#ifdef CONFIG_KSU\n"
                          "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, "
                          "void *argv, void *envp, int *flags);\n"
                          "#endif\n"
                      )
                      hook_call = (
                          "#ifdef CONFIG_KSU\n"
                          "\tksu_handle_execveat(&fd, &filename, argv, envp, &flags);\n"
                          "#endif\n"
                      )
                      exec_src = exec_src[:idx] + decl + exec_src[idx:brace_idx + 2] + hook_call + exec_src[brace_idx + 2:]
                      exec_path.write_text(exec_src, encoding="utf-8")
                      print("Patched fs/exec.c")
              else:
                  print("WARN: do_execveat_common not found in fs/exec.c")

          # 2. drivers/input/input.c hook (input_handle_event)
          input_path = Path("drivers/input/input.c")
          input_src = input_path.read_text(encoding="utf-8", errors="ignore")
          if "ksu_handle_input_event" not in input_src:
              target = "static void input_handle_event(struct input_dev *dev,"
              idx = input_src.find(target)
              if idx != -1:
                  brace_idx = input_src.find("{\n", idx)
                  if brace_idx != -1:
                      decl = (
                          "\n#ifdef CONFIG_KSU\n"
                          "extern int ksu_handle_input_event(unsigned int *type, unsigned int *code, int *value);\n"
                          "#endif\n"
                      )
                      hook_call = (
                          "#ifdef CONFIG_KSU\n"
                          "\tksu_handle_input_event(&type, &code, &value);\n"
                          "#endif\n"
                      )
                      input_src = input_src[:idx] + decl + input_src[idx:brace_idx + 2] + hook_call + input_src[brace_idx + 2:]
                      input_path.write_text(input_src, encoding="utf-8")
                      print("Patched drivers/input/input.c")
              else:
                  print("WARN: input_handle_event not found in drivers/input/input.c")

          # 3. Guard conflicting static inline audit_update_lsm_rules in include/linux/audit.h
          audit_path = Path("include/linux/audit.h")
          if audit_path.exists():
              lines = audit_path.read_text(encoding="utf-8", errors="ignore").splitlines(keepends=True)
              out_lines = []
              i = 0
              patched_audit = False
              while i < len(lines):
                  line = lines[i]
                  if "static inline int audit_update_lsm_rules" in line and not patched_audit:
                      out_lines.append("#if 0\n")
                      brace_depth = 0
                      started_body = False
                      while i < len(lines):
                          cur = lines[i]
                          out_lines.append(cur)
                          if "{" in cur:
                              brace_depth += cur.count("{")
                              started_body = True
                          if "}" in cur:
                              brace_depth -= cur.count("}")
                          i += 1
                          if started_body and brace_depth <= 0:
                              break
                          if not started_body and ";" in cur:
                              break
                      out_lines.append("#endif\n")
                      patched_audit = True
                  else:
                      out_lines.append(line)
                      i += 1

              if patched_audit:
                  audit_path.write_text("".join(out_lines), encoding="utf-8")
                  print("Guarded static inline audit_update_lsm_rules in include/linux/audit.h")

          # 4. Forward-declare wakeup_source_deactivate right before the enclosing function of its first call
          wakeup_path = Path("drivers/base/power/wakeup.c")
          if wakeup_path.exists():
              w_lines = wakeup_path.read_text(encoding="utf-8", errors="ignore").splitlines(keepends=True)
              fwd_stmt = "static void wakeup_source_deactivate(struct wakeup_source *ws);\n"
              w_text = "".join(w_lines)
              if fwd_stmt.strip() not in w_text:
                  call_idx = -1
                  for idx_line, l in enumerate(w_lines):
                      stripped = l.lstrip()
                      if "wakeup_source_deactivate(" in stripped and not stripped.startswith("static void wakeup_source_deactivate("):
                          call_idx = idx_line
                          break
                  if call_idx != -1:
                      fn_start = -1
                      for back_idx in range(call_idx, -1, -1):
                          s = w_lines[back_idx].lstrip()
                          if (s.startswith("static ") or s.startswith("void ") or s.startswith("int ") or s.startswith("bool ")) and "(" in s and not s.endswith(";"):
                              fn_start = back_idx
                              break
                      insert_at = fn_start if fn_start != -1 else call_idx
                      w_lines.insert(insert_at, "\n" + fwd_stmt + "\n")
                      wakeup_path.write_text("".join(w_lines), encoding="utf-8")
                      print(f"Inserted wakeup_source_deactivate forward declaration at line {insert_at + 1}")
          EOF

      - name: Configure Defconfig with CONFIG_KSU=y
        env:
          DEFCONFIG: exynos9810-crownlte_defconfig
        run: |
          ls -la arch/arm64/configs/*crownlte* || true
          mkdir -p out
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=aarch64-linux-gnu-ld HOSTCC=clang HOSTLD=ld \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"

          python3 - << 'EOF'
          import os
          from pathlib import Path

          defconfig_name = os.environ.get("DEFCONFIG", "exynos9810-crownlte_defconfig")
          bad_tokens = (
              "-fmodulo-sched-allow-regmoves",
              "-allow-regmoves",
              "allow-regmoves",
              "-fmodulo-sched",
              "-fpredictive-commoning",
              "-fno-aggressive-loop-optimizations",
              "-funswitch-loops",
              "-fgcse-after-reload",
          )

          def clean_text(text: str) -> str:
              for tok in bad_tokens:
                  text = text.replace(tok, "")
              return text

          for p in [
              Path("Makefile"),
              Path("Kbuild"),
              Path("arch/arm64/Makefile"),
              Path(f"arch/arm64/configs/{defconfig_name}"),
              Path("out/.config"),
              Path("out/include/config/auto.conf"),
          ]:
              if p.exists():
                  orig = p.read_text(encoding="utf-8", errors="ignore")
                  cleaned = clean_text(orig)
                  if cleaned != orig:
                      p.write_text(cleaned, encoding="utf-8")
                      print(f"Cleaned {p}")

          cfg_path = Path("out/.config")
          lines = [
              l for l in cfg_path.read_text(encoding="utf-8", errors="ignore").splitlines(keepends=True)
              if not l.startswith("CONFIG_KSU=")
              and not l.startswith("# CONFIG_KSU")
              and not l.startswith("CONFIG_CC_STACKPROTECTOR")
              and not l.startswith("# CONFIG_CC_STACKPROTECTOR")
          ]
          lines.extend([
              "CONFIG_KSU=y\n",
              "CONFIG_CC_STACKPROTECTOR=y\n",
              "CONFIG_CC_STACKPROTECTOR_NONE=y\n",
              "# CONFIG_CC_STACKPROTECTOR_REGULAR is not set\n",
              "# CONFIG_CC_STACKPROTECTOR_STRONG is not set\n",
          ])
          cfg_path.write_text(clean_text("".join(lines)), encoding="utf-8")
          EOF

          yes "" | make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=aarch64-linux-gnu-ld HOSTCC=clang HOSTLD=ld \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- olddefconfig >/dev/null

          python3 - << 'EOF'
          from pathlib import Path
          bad_tokens = (
              "-fmodulo-sched-allow-regmoves",
              "-allow-regmoves",
              "allow-regmoves",
              "-fmodulo-sched",
              "-fpredictive-commoning",
              "-fno-aggressive-loop-optimizations",
              "-funswitch-loops",
              "-fgcse-after-reload",
          )
          for p in [Path("out/.config"), Path("out/include/config/auto.conf")]:
              if p.exists():
                  text = p.read_text(encoding="utf-8", errors="ignore")
                  for tok in bad_tokens:
                      text = text.replace(tok, "")
                  p.write_text(text, encoding="utf-8")
          EOF

          grep -E "CONFIG_KSU|CONFIG_CC_STACKPROTECTOR" out/.config

      - name: Build Kernel Image
        run: |
          set -o pipefail
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=aarch64-linux-gnu-ld HOSTCC=clang HOSTLD=ld \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="--target=aarch64-linux-gnu -I$PWD -Wno-unknown-warning-option -Wno-gnu-variable-sized-type-not-at-end -Wno-unknown-attributes -Wno-error=implicit-function-declaration" \
            Image 2>&1 | tee build.log || {
              echo "=== EXACT COMPILER ERRORS ==="
              grep -n -C 3 "error:" build.log | tail -n 50
              exit 1
            }
          ls -lh out/arch/arm64/boot/Image

      - name: Package AnyKernel3 Flashable Zip
        run: |
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          cd AnyKernel3
          zip -r9 ../BeastMode-N960F-OneUI2.5-KernelSU-Next.zip * -x '*.git*'
          cd ..
          ls -lh BeastMode-N960F-OneUI2.5-KernelSU-Next.zip

      - name: Upload KernelSU-Next Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeastMode-N960F-OneUI2.5-KernelSU-Next
          path: BeastMode-N960F-OneUI2.5-KernelSU-Next.zip
